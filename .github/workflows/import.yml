name: import  # ワークフロー名

on:
  workflow_dispatch:  # 手動実行可能
  schedule:
    # GitHub Actionsの仕様上、スケジュール実行は数十分〜1時間程度遅延することがあります。
    # 混雑する「00分」を避け、かつ24時までに確実に完了させるため、
    # 予定より少し早めの 日本時間 22:47 (UTC 13:47) に設定しています。
    - cron: '47 13 * * *'

jobs:
  import_markdown:  # ジョブ名
    runs-on: ubuntu-latest  # Ubuntu最新版で実行
    
    steps:
      # actions/checkout は GitHub公式アクション。
      # リポジトリのコードをランナー（ubuntu）にダウンロードしてくれる。
      # これがないと git push など後続のステップが動かない。
      - name: Checkout repository  # リポジトリをチェックアウト
        uses: actions/checkout@v4
       
      # NotionからMarkdownをエクスポート
      # 自分の別リポジトリに置いたカスタムアクションを呼び出す。
      # @main = mainブランチの action.yml が実行される。
      # with: でアクション側に定義された引数を渡す。
      - name: Export The Notion Database to local markdown files.
        id: export  # このステップにIDを付与して後で参照可能に
        uses: rendya2501/notion-md-converter-playground@main
        with:
          notion_auth_token: ${{ secrets.NOTION_AUTH_TOKEN }}
          notion_database_id: ${{ secrets.NOTION_DATABASE_ID }}
          output_directory_path_template: "articles/{{publish|date.to_string('%Y/%m')}}/{{slug}}"

      # エクスポート件数が0でない場合のみコミット・プッシュする。
      # steps.export.outputs.exported_count は export ステップが GITHUB_OUTPUT に書いた値。
      - name: Commit and push exported markdown files
        if: ${{ steps.export.outputs.exported_count != '0' && steps.export.outputs.exported_count != '' }}
        run: |
          git config --global user.email "${{ vars.USER_EMAIL }}"
          git config --global user.name "${{ vars.USER_NAME }}"        
          git add articles/
          git commit -m "Import files from notion database (${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER})"
          git push origin ${{ github.ref_name }}
